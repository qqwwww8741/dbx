[package]
name = "dbx-drivers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
# Desktop/native SQL Server batch interruption; see dbx-driver-sqlserver.
sqlite-bundled = []
sqlite-sqlcipher = []
test-support = ["dbx-driver-mysql/test-support", "dbx-driver-support/test-support", "dbx-platform/test-support"]

[dependencies]
dbx-driver-support = { path = "../dbx-driver-support" }
dbx-driver-mysql = { path = "../dbx-driver-mysql" }
dbx-types = { path = "../dbx-types", default-features = false }
dbx-sql-core = { path = "../dbx-sql-core" }
dbx-sql-data = { path = "../dbx-sql-data" }
dbx-sql-dialect = { path = "../dbx-sql-dialect" }
dbx-platform = { path = "../dbx-platform", features = ["host-prompts", "downloads"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
json5 = "0.4"
regex = "1"
percent-encoding = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "0.26"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "client_ed25519", "chrono", "rust_decimal"] }
sqlparser = { version = "0.62.0", features = ["visitor"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "stream", "rustls-tls", "socks"] }
futures = "0.3"
russh = "0.60"
pageant = "0.2"
portpicker = "0.1.1"
csv = "1"
base64 = "0.22"
sha2 = "0.10"
bytes = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
crc = "3"
tar = "0.4"
zstd = "0.13"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
dbx-driver-support = { path = "../dbx-driver-support", features = ["test-support"] }
dbx-platform = { path = "../dbx-platform", features = ["test-support"] }
mysql_common = { git = "https://github.com/t8y2/rust_mysql_common.git", rev = "47740d85a8277167a5717afac785d37b46a36296", default-features = false }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(all(unix, not(target_os = "redox")))'.dev-dependencies]
nix = { version = "0.31.3", features = ["user"] }
