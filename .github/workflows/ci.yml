name: MySQL edition checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config perl libfontconfig1-dev libfreetype6-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:connection-types
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=10240
      - run: pnpm build
      - run: cargo check --locked -p dbx-web -p dbx-cli -p dbx-mcp
      - run: pnpm test:mysql
      - run: pnpm test:db-env
      - run: cargo test --locked -p dbx-core -p dbx-driver-mysql -p dbx-sql-core -p dbx-sql-data -p dbx-sql-dialect -p dbx-sql-schema -p dbx-types --lib --no-default-features --features dbx-core/sqlite-bundled
